name: MVP local unit tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed state machine
        run: PYTHONPATH=src python -m unittest discover -s tests -v
